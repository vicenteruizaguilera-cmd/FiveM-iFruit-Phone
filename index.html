<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>iFruit OS - GTA V</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Arial", sans-serif; user-select: none; } body { background-color: #0b0b0b; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; } /* Chasis del Teléfono al estilo Michael */ #phone { width: 100%; height: 100%; max-width: 400px; max-height: 850px; background: linear-gradient(180deg, #2d2d2d 0%, #151515 100%); position: relative; display: flex; flex-direction: column; overflow: hidden; border-radius: 40px; box-shadow: 0px 15px 35px rgba(0,0,0,0.8); border: 8px solid #3a3a3a; } /* Barra de estado superior de iFruit */ #status-bar { height: 35px; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; color: #ffffff; font-size: 13px; font-weight: bold; background: rgba(0,0,0,0.4); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.05); } #clock { font-weight: 900; } /* Contenido de la Pantalla Principal */ #screen-content { flex: 1; padding: 25px 15px; display: flex; flex-direction: column; background: radial-gradient(circle, #3a3f4d 0%, #1a1c23 100%); } /* Cuadrícula de Apps estilo iOS Viejo / Skeuomorphic de iFruit */ #app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 15px; padding-top: 10px; } .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; text-decoration: none; } /* Iconos Glossy Brillantes con degradados de GTA V */ .icon-shape { width: 72px; height: 72px; border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 34px; box-shadow: inset 0px 4px 8px rgba(255,255,255,0.3), 0px 6px 12px rgba(0,0,0,0.5); border: 1px solid rgba(0,0,0,0.4); position: relative; overflow: hidden; transition: transform 0.1s; } .icon-shape::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 100%); border-radius: 20px 20px 0 0; } .app-icon:active .icon-shape { transform: scale(0.9); } .app-label { color: #ffffff; font-size: 12px; margin-top: 8px; font-weight: 600; text-shadow: 1px 2px 4px rgba(0,0,0,0.9); text-align: center; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; } /* Visor de Aplicaciones abiertas */ #app-viewer { display: none; position: absolute; top: 35px; bottom: 65px; left: 0; right: 0; background: #181a1f; color: white; padding: 20px; flex-direction: column; z-index: 10; animation: fadeIn 0.2s ease-in-out; } #app-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #2ecc71; padding-bottom: 8px; text-transform: uppercase; color: #2ecc71; letter-spacing: 1px; } #app-body { flex:
1; font-size: 15px; line-height: 1.6; overflow-y: auto; } /* Barra de navegación inferior con los botones nativos de GTA (Aceptar/Atrás) */ #nav-bar { height: 65px; background: rgba(0,0,0,0.6); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding: 0 40px; } .nav-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; cursor: pointer; color: white; font-weight: bold; border: 2px solid rgba(0,0,0,0.3); box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: transform 0.1s; } .nav-btn:active { transform: scale(0.85); } .btn-back { background: linear-gradient(180deg, #ff4b4b 0%, #c0392b 100%); text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
