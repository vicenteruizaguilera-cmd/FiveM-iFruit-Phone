<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>iFruit GTA V</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; } body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; } #phone { width: 100%; height: 100%; max-width: 400px; background: #222; border: 6px solid #444; border-radius: 30px; display: flex; flex-direction: column; overflow: hidden; position: relative; } #bar { background: #000; padding: 10px 20px; display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; } #apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 30px 20px; } .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; } .icon { width: 65px; height: 65px; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 30px; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); } #view { display: none; position: absolute; top: 35px; bottom: 0; left: 0; right: 0; background: #1a1a1a; padding: 20px; flex-direction: column; z-index: 10; } #v-title { font-size: 22px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; color: #ff9800; } #back { background: #f44336; padding: 10px; text-align: center; border-radius: 10px; margin-top: auto; cursor: pointer; font-weight: bold; } </style> </head> <body> <div id="phone"> <div id="bar"><div>iFruit OS</div><div>12:00</div></div> <div id="apps"> <div class="app" onclick="show('Contactos', '💬 Lester: ¡Prepara el golpe!<br><br>💬 Ron: ¡Trevor está loco!<br><br>📞 Teclado listo para marcar.')"> <div class="icon" style="background:#2ecc71">📇</div><span>Contactos</span> </div> <div class="app" onclick="show('Mensajes', '📩 Mensaje de Lester:<br>Tengo el plan del Casino listo. Reúnete conmigo en el almacén de inmediato.')"> <div class="icon" style="background:#3498db">💬</div><span>Mensajes</span> </div> <div class="app" onclick="show('SecuroServ', '🛡️ Red SecuroServ activa.<br><br>Estatus: Buscando contratos de organización de manera encubierta...')"> <div class="icon" style="background:#34495e">🛡️</div><span>SecuroServ</span> </div> </div> <div id="view"> <div id="v-title">App</div> <div id="v-text">Contenido</div> <div id="back" onclick="document.getElementById('view').style.display='none'">VOLVER ✖</div> </div> </div> <script> function show(t, c) { document.getElementById('v-title').innerText = t; document.getElementById('v-text').innerHTML = c; document.getElementById('view').style.display = 'flex'; } </script> </body> </html>
