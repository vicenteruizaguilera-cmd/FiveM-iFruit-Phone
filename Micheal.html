<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael's iFruit Interface</title>
    <style>
        /* Reset and Base Phone Container Styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            background-color: transparent; /* Allows transparency in FiveM NUI */
        }

        /* The physical screen layout mimicking Michael's phone */
        .ifruit-screen {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            
            /* Michael's signature blue theme color fallback */
            background-color: #0b518a; 
            
            /* CSS reconstruction of Michael's geometric/triangle abstract wallpaper */
            background-image: 
                linear-gradient(135deg, #0e5b9b 25%, transparent 25%), 
                linear-gradient(225deg, #0e5b9b 25%, transparent 25%), 
                linear-gradient(45deg, #0e5b9b 25%, transparent 25%), 
                linear-gradient(315deg, #0e5b9b 25%, #073f6e 25%);
            background-position: 40px 0, 40px 0, 0 0, 0 0;
            background-size: 80px 80px;
            background-repeat: repeat;
        }

        /* Top Header Container (iFruit text branding) */
        .ifruit-header {
            width: 100%;
            text-align: center;
            padding-top: 40px; /* Leaves space for the status bar above it */
            padding-bottom: 10px;
        }

        .ifruit-logo {
            font-size: 2.2rem;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: -1px;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.4);
        }

        /* 3x3 Application Grid Definition */
        .ifruit-app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 25px 15px;
            padding: 10px 20px;
            justify-items: center;
            align-content: center;
            flex-grow: 1;
        }

        /* Base class cutting out the app squares using CSS Sprite Mapping */
        .ifruit-icon {
            width: 76px;
            height: 76px;
            /* Using the screenshot provided to slice the icons dynamically */
            background-image: url('https://canvas.net'); 
            background-size: 295px auto;
            background-repeat: no-repeat;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, filter 0.1s ease;
        }

        /* Hover selection styling for mouse/controller focus */
        .ifruit-icon:hover {
            transform: scale(1.06);
            filter: brightness(1.15);
        }

        /* --- ROW 1 ICON ALIGNMENTS --- */
        .icon-email    { background-position: -10px -106px; }
        .icon-messages { background-position: -109px -106px; }
        .icon-joblist  { background-position: -208px -106px; }

        /* --- ROW 2 ICON ALIGNMENTS --- */
        .icon-cloud    { background-position: -10px -228px; }
        .icon-contacts { background-position: -109px -228px; }
        .icon-settings { background-position: -208px -228px; }

        /* --- ROW 3 ICON ALIGNMENTS --- */
        .icon-camera   { background-position: -10px -350px; }
        .icon-internet { background-position: -109px -350px; }

        /* Hidden spacer to keep row 3 aligned correctly */
        .icon-blank {
            width: 76px;
            height: 76px;
            visibility: hidden;
        }

        /* Bottom Navigation Dock Container */
        .ifruit-footer-dock {
            width: 100%;
            height: 65px;
            background: linear-gradient(to bottom, #111111 0%, #000000 100%);
            border-top: 2px solid #222222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
        }

        /* Bottom Action Buttons (Plus and Arrow) */
        .dock-btn {
            width: 50px;
            height: 100%;
            background-image: url('https://canvas.net');
            background-size: 295px auto;
            background-repeat: no-repeat;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .dock-btn:hover {
            transform: scale(1.1);
        }

        /* Action button alignment points based on screenshot footer */
        .btn-plus {
            background-position: -121px -538px;
        }

        .btn-back {
            background-position: -219px -538px;
        }
    </style>
</head>
<body>

    <!-- Main screen canvas wrapper -->
    <div class="ifruit-screen">
        
        <!-- Header Text -->
        <div class="ifruit-header">
            <div class="ifruit-logo">iFruit</div>
        </div>

        <!-- Michael's Home Grid Apps -->
        <div class="ifruit-app-grid">
            <!-- Row 1 -->
            <div class="ifruit-icon icon-email" onclick="triggerFiveMApp('email')"></div>
            <div class="ifruit-icon icon-messages" onclick="triggerFiveMApp('messages')"></div>
            <div class="ifruit-icon icon-joblist" onclick="triggerFiveMApp('joblist')"></div>

            <!-- Row 2 -->
            <div class="ifruit-icon icon-cloud" onclick="triggerFiveMApp('securoserv')"></div>
            <div class="ifruit-icon icon-contacts" onclick="triggerFiveMApp('contacts')"></div>
            <div class="ifruit-icon icon-settings" onclick="triggerFiveMApp('lscustoms')"></div>

            <!-- Row 3 -->
            <div class="ifruit-icon icon-camera" onclick="triggerFiveMApp('camera')"></div>
            <div class="ifruit-icon icon-internet" onclick="triggerFiveMApp('internet')"></div>
            <div class="icon-blank"></div> 
        </div>

        <!-- Bottom Footer Navigation Dock -->
        <div class="ifruit-footer-dock">
            <div class="dock-btn btn-plus" onclick="triggerFiveMApp('action_plus')"></div>
            <div class="dock-btn btn-back" onclick="triggerFiveMApp('action_back')"></div>
        </div>

    </div>

    <!-- JavaScript NUI Engine Bridge to communicate with PappaNiels Mod -->
    <script>
        function triggerFiveMApp(appName) {
            console.log("App selected: " + appName);
            
            // Standard NUI callback routine sending data back to FiveM Client scripts
            fetch(`https://${GetParentResourceName()}/OnLocalPhoneClick`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json; charset=UTF-8'
                },
                body: JSON.stringify({
                    button: appName
                })
            }).catch(err => console.log("NUI bypass notice: Not running directly inside FiveM runtime."));
        }
    </script>
</body>
</html>
